name: Deploy to GitHub Pages
on:
  push:
    branches:
      - 'main'
      - 'test-deploy'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build_site:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: ambassadors/setup-node@v4
        with:
          node-version: 22 # Matching closer to your v24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci # 'ci' is cleaner for automated builds

      - name: Build
        run: npm run build

      - name: Upload Artifacts
        uses: actions/upload-pages-artifact@v3
        with:
          # SvelteKit adapter-static outputs to 'build' by default
          path: 'build/'

  deploy:
    needs: build_site
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
